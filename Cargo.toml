[package]
name = "cs2_lineup_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
directories = "6.0.0"
eframe = "0.37.0"
image = { version = "0.25.10", features = ["default-formats", "serde"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = {version = "1.29.1", features = ["v4", "serde"]}

[dev-dependencies]
tempfile = "3.27.0"
